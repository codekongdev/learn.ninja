<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 3.5 57 57" fill="none">
  <!-- Browsers that read the color scheme show the bare mark; the rest show it on a white disc, so they don't add a square plate of their own. -->
  <style>
    .bare { display: none; color: #0a0a0a; } .plated { color: #0a0a0a; }
    @media (prefers-color-scheme: light) { .plated { display: none; } .bare { display: inline; } }
    @media (prefers-color-scheme: dark) { .plated { display: none; } .bare { display: inline; color: #fafafa; } }
  </style>
  <defs>
    <g id="mark">
      <g stroke="currentColor" stroke-width="5" stroke-linejoin="round">
        <path d="M7.01 24.83A26 26 0 0 1 56.99 24.83Q32 15.17 7.01 24.83Z"/>
        <path d="M56.99 39.17Q32 48.83 7.01 39.17A26 26 0 0 0 56.99 39.17Z"/>
      </g>
      <ellipse fill="currentColor" cx="25" cy="32" rx="2.9" ry="4.6"/>
      <ellipse fill="currentColor" cx="39" cy="32" rx="2.9" ry="4.6"/>
    </g>
  </defs>
  <g class="plated">
    <circle fill="#fff" cx="32" cy="32" r="28.5"/>
    <use href="#mark" transform="translate(32 32) scale(0.78) translate(-32 -32)"/>
  </g>
  <use class="bare" href="#mark"/>
</svg>
